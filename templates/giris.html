<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Giriş — Lazer Grubu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/giris.css">
</head>
<body>
<form class="kutu" id="form">
  <div class="marka"><div class="logo">L</div><b>Lazer Grubu</b></div>
  <p class="alt">Aylık Rapor Otomasyonu · güvenli giriş</p>
  <label for="kullanici">Kullanıcı adı</label>
  <input id="kullanici" autocomplete="username" autofocus>
  <label for="sifre">Şifre</label>
  <input id="sifre" type="password" autocomplete="current-password">
  <button type="submit" id="btn">Giriş yap</button>
  <div class="hata" id="hata"></div>
  <p class="ipuc">Yalnızca yetkili ekip erişimi içindir.</p>
</form>
<script src="/static/js/giris.js"></script>
</body>
</html>
